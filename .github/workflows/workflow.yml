name: Build script.js from Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (خالی = latest)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get release info
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=$(gh release view --json tagName -q .tagName)
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "📦 TAG = $TAG"

          # دریافت JSON خام (بدون -q) تا آرایه معتبر بمونه
          gh release view "$TAG" --json assets > assets.json

          echo "--- محتوای assets.json ---"
          cat assets.json
          echo "--------------------------"

      - name: Generate script.js
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: python scripts/generate.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add script.js
          if git diff --cached --quiet; then
            echo "✅ تغییری نکرد"
          else
            git commit -m "🤖 auto-update script.js [skip ci]"
            git push
          fi
